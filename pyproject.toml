[project]
name = "receipt-ocr-bets"
version = "0.1.0"
description = "Bet receipt parser with AI (OCR + JSON normalization)"
authors = [
    {name = "olyaef", email = "efimovskikh@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai (>=1.60.0,<3.0.0)",
    "pydantic (>=2.10.0,<3.0.0)",
    "python-dotenv (>=1.0.1,<2.0.0)",
    "pillow (>=10.0.0,<14.0.0)",
    "tenacity (>=8.2.0,<10.0.0)",
    "python-dateutil (>=2.8.2,<4.0.0)",
    "typer (>=0.12.0,<1.0.0)",
    "rich (>=13.0.0,<16.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
